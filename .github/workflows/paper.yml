name: 模拟盘每日运行

on:
  push:
    branches: [main]
    paths:
      - 'data_fetch/check_freshness.py'
      - 'data_fetch/fetch_status.py'
      - 'paper/run_daily.sh'
      - '.github/workflows/paper.yml'
  schedule:
    # 批量数据包优先，日期未到当天则失败并等待下一次重试。
    - cron: "15 13 * * 1-5"  # 北京时间 21:15 主任务
    - cron: "15 15 * * 1-5"  # 北京时间 23:15 重试
    - cron: "15 23 * * 0-4"  # 北京时间次日 07:15 最后重试
  workflow_dispatch:
    inputs:
      force:
        description: "强制重跑（即使账户已是最新）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      RA_PROVIDER: ${{ github.workspace }}/../qlib_data/cn_data
      RA_DATA: ${{ github.workspace }}/../ra_data
      FORCE: ${{ inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: paper/requirements.txt

      - name: 安装依赖
        run: pip install -r paper/requirements.txt

      - name: 运行模拟盘
        run: bash paper/run_daily.sh

      - name: 提交结果
        if: env.NOTHING_TO_DO != '1'
        run: |
          git config user.name "paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/accounts paper/signals paper/README.md paper/data/extra/industry.parquet paper/data/extra/em_holders.parquet
          for f in security_status security_basic execution_0935; do
            test ! -f "paper/data/extra/$f.parquet" || git add "paper/data/extra/$f.parquet"
          done
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          DAY=$(tail -1 "$RA_PROVIDER/calendars/day.txt")
          git commit -q -m "模拟盘 $DAY"
          pushed=0
          for i in 1 2 3; do
            if git pull -q --rebase && git push -q; then pushed=1; break; fi
            sleep 5
          done
          test "$pushed" = 1
